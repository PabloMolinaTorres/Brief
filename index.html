<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Brief de Postproducción</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background: #f4f8f2;
            color: #333;
        }
        header {
            background: #0b3b24;
            color: #ffffff;
            padding: 16px 24px;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
        }
        header p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: 0.95;
        }
        main {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px 40px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            border: 1px solid #e3eddd;
        }
        .card h2 {
            margin: 0 0 12px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .card h2 span.label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #7a8a76;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        .option {
            border-radius: 8px;
            border: 1px solid #d5e3cf;
            padding: 8px;
            position: relative;
            cursor: pointer;
            background: #fafdf8;
            transition: all 0.15s ease;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .option input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .option img {
            width: 100%;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #e1ebdd;
        }
        .option span.main-label {
            font-weight: 600;
        }
        .option span.sub-label {
            font-size: 11px;
            color: #667363;
        }
        .option:hover {
            border-color: #8FCA00;
            background: #f2fbe6;
        }
        .option.selected {
            border-color: #8FCA00;
            box-shadow: 0 0 0 1px #8FCA00;
            background: #e9f8d3;
        }
        .custom-input {
            margin-top: 4px;
            font-size: 12px;
        }
        .custom-input label {
            display: block;
            margin-bottom: 3px;
            color: #4e5a4a;
        }
        .custom-input input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #c4d2be;
            font-size: 12px;
        }
        textarea {
            width:100%;
            border-radius:8px;
            border:1px solid #c4d2be;
            padding:8px;
            font-size:13px;
        }
        button.primary {
            background: #8FCA00;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
        }
        #resumen {
            display: none;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            background: #111;
            color: #e2ffe9;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>Brief de Postproducción</h1>
    <p>Selecciona las configuraciones de retoque.</p>
</header>

<main>

<!-- SOMBRA -->
<section class="card">
    <h2>Sombra <span class="label">Intensidad</span></h2>
    <div class="options-grid" data-group="sombra">

        <label class="option">
            <input type="radio" name="sombra" value="Sin sombra">
            <img src="sinsombra.png" alt="Sin sombra">
            <span class="main-label">Sin sombra</span>
            <span class="sub-label">Producto flotando, sin sombra visible.</span>
        </label>

        <label class="option">
            <input type="radio" name="sombra" value="25%">
            <img src="sombra25.png" alt="Sombra 25%">
            <span class="main-label">25%</span>
            <span class="sub-label">Sombra muy suave.</span>
        </label>

        <label class="option">
            <input type="radio" name="sombra" value="50%">
            <img src="sombra50.png" alt="Sombra 50%">
            <span class="main-label">50%</span>
            <span class="sub-label">Sombra media.</span>
        </label>

        <label class="option">
            <input type="radio" name="sombra" value="75%">
            <img src="sombra75.png" alt="Sombra 75%">
            <span class="main-label">75%</span>
            <span class="sub-label">Sombra marcada.</span>
        </label>

        <label class="option">
            <input type="radio" name="sombra" value="100%">
            <img src="sombra100.png" alt="Sombra 100%">
            <span class="main-label">100%</span>
            <span class="sub-label">Sombra intensa.</span>
        </label>

        <!-- PERSONALIZADO SIN IMAGEN -->
        <label class="option">
            <input type="radio" name="sombra" value="Personalizado">
            <span class="main-label">Personalizado</span>
            <span class="sub-label">Indicar detalle específico.</span>
            <div class="custom-input">
                <label>Detalle sombra</label>
                <input type="text" id="sombraCustom" placeholder="Ej: 35% opacidad, desplazada">
            </div>
        </label>

    </div>
</section>

<button class="primary" id="btnFinalizar">Finalizar</button>
<div id="resumen"></div>

</main>

<script>
document.querySelectorAll(".options-grid").forEach(group => {
    group.addEventListener("click", e => {
        const option = e.target.closest(".option");
        if (!option) return;
        const input = option.querySelector("input[type='radio']");
        group.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        option.classList.add("selected");
        input.checked = true;
    });
});
</script>

</body>
</html>
